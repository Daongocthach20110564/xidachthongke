<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xì Dách Thống Kê - 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
      :root {
        --m3-surface: #1c1b1f;
        --m3-primary: #d0bcff;
        --m3-on-primary: #381e72;
      }
      body {
        background-color: var(--m3-surface);
        color: #e6e1e5;
        font-family: "Poppins", sans-serif;
        overflow-x: hidden;
      }
      .m3-card {
        background-color: #2b2930;
        border-radius: 16px;
        transition: all 0.2s;
      }
      .m3-input-field {
        background-color: #49454f;
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid transparent;
      }
      .m3-btn-primary {
        background-color: var(--m3-primary);
        color: var(--m3-on-primary);
        border-radius: 100px;
        font-weight: 600;
      }
      .m3-btn-tonal {
        background-color: #4a4458;
        color: #e8def8;
        border-radius: 100px;
      }
      .is-cai-active {
        outline: 2px solid var(--m3-primary);
        background-color: #35313d !important;
        position: relative;
      }
      .is-cai-active::after {
        content: "CHỦ SÒNG";
        position: absolute;
        top: 0;
        right: 0;
        background: #d0bcff;
        color: #381e72;
        font-size: 8px;
        font-weight: bold;
        padding: 1px 10px;
        border-radius: 0 0 0 10px;
      }
      .status-btn {
        border-radius: 8px;
        font-size: 10px;
        font-weight: bold;
        padding: 8px 2px;
        transition: all 0.2s;
        border: 1px solid #49454f;
        flex: 1;
        text-align: center;
      }
      .status-win {
        background-color: #2e7d32;
        color: white;
        border-color: #4caf50;
      }
      .status-lose {
        background-color: #c62828;
        color: white;
        border-color: #f44336;
      }
      .status-draw {
        background-color: #4a4458;
        color: #e8def8;
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .sticky-live-balance {
        position: sticky;
        top: 8px;
        z-index: 45;
        margin-bottom: 12px;
      }
      .sticky-bottom-action {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 12px;
        background: linear-gradient(to top, var(--m3-surface) 90%, transparent);
        z-index: 50;
      }
      .reset-btn {
        background: rgba(255, 255, 255, 0.05);
      }
      .summary-chip {
        background: #35313d;
        border: 1px solid #49454f;
        border-radius: 12px;
        padding: 6px 10px;
      }
    </style>
  </head>
  <body class="min-h-screen pb-24">
    <div class="max-w-xl mx-auto px-4">
      <header class="flex items-center justify-between py-6">
        <div>
          <h1 class="text-2xl font-bold">Xì Dách</h1>
          <p
            class="text-[#d0bcff] text-[10px] font-bold tracking-[0.2em] uppercase"
          >
            Thống Kê 2026
          </p>
        </div>
        <div class="flex items-center gap-3">
          <button
            onclick="resetAll()"
            class="reset-btn p-2 rounded-full text-[#eaddff]"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
          <div
            class="bg-[#4f378b] px-4 py-1.5 rounded-full border border-[#d0bcff]/20"
          >
            <span class="text-xs font-bold text-[#eaddff]"
              >VÁN #<span id="current-game-no">1</span></span
            >
          </div>
        </div>
      </header>

      <div class="flex p-1.5 bg-[#2b2930] rounded-full mb-6">
        <button
          onclick="switchTab('home')"
          id="btn-home"
          class="flex-1 py-2 rounded-full text-sm font-semibold m3-btn-primary shadow-md"
        >
          Trang chủ
        </button>
        <button
          onclick="switchTab('history')"
          id="btn-history"
          class="flex-1 py-2 rounded-full text-sm font-semibold text-[#cac4d0]"
        >
          Lịch sử
        </button>
      </div>

      <div id="tab-home" class="tab-content active space-y-4">
        <div id="cai-live-sticky" class="sticky-live-balance hidden">
          <div
            class="m3-card p-4 bg-[#381e72] border border-[#d0bcff]/30 shadow-lg flex justify-between items-center"
          >
            <div class="flex gap-6">
              <div class="flex flex-col">
                <span class="text-[10px] text-[#d0bcff]/70 font-bold uppercase"
                  >Tổng cược</span
                >
                <span id="total-bet-live" class="text-sm font-bold text-white"
                  >0đ</span
                >
              </div>
              <div class="flex flex-col">
                <span class="text-[10px] text-[#d0bcff] font-bold uppercase"
                  >Ăn được</span
                >
                <span id="live-cai-diff" class="text-base font-black">0đ</span>
              </div>
            </div>
            <div class="text-right">
              <p class="text-[10px] text-gray-400 uppercase font-bold">
                CHỦ SÒNG
              </p>
              <p
                class="font-bold text-white text-sm uppercase"
                id="cai-name-text"
              >
                -
              </p>
            </div>
          </div>
        </div>

        <div class="m3-card p-4 flex gap-3 items-center">
          <input
            id="new-player-name"
            type="text"
            placeholder="Tên người chơi mới..."
            class="flex-1 m3-input-field text-sm text-white"
          />
          <button
            onclick="addPlayer()"
            class="m3-btn-primary px-6 py-2.5 text-sm"
          >
            Thêm
          </button>
        </div>

        <div
          class="m3-card p-4 bg-[#35313d] border border-[#d0bcff]/10 flex gap-3 items-center"
        >
          <div
            class="flex-1 flex items-center bg-[#1c1b1f] rounded-lg px-3 py-1.5"
          >
            <span
              class="text-[10px] text-[#d0bcff] font-bold mr-3 uppercase tracking-tight"
              >Cược chung</span
            >
            <input
              id="quick-bet-value"
              type="number"
              value="5000"
              class="bg-transparent font-bold text-white text-sm w-full text-right outline-none"
            />
          </div>
          <button
            onclick="applyQuickBet()"
            class="m3-btn-tonal px-5 py-2.5 text-xs font-bold uppercase"
          >
            Áp dụng
          </button>
        </div>

        <div id="player-list" class="space-y-3"></div>
      </div>

      <div id="footer-action" class="sticky-bottom-action max-w-xl mx-auto">
        <button
          onclick="finishGame()"
          class="m3-btn-primary w-full py-4 text-sm font-bold shadow-xl ring-4 ring-[#1c1b1f]"
        >
          KẾT THÚC VÁN ĐẤU
        </button>
      </div>

      <div id="tab-history" class="tab-content space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-semibold">Lịch sử</h2>
          <button
            onclick="exportToExcel()"
            class="bg-[#381e72] text-[#eaddff] px-5 py-2 rounded-full text-xs font-bold uppercase"
          >
            Xuất Excel
          </button>
        </div>
        <div
          id="history-summary"
          class="m3-card p-4 space-y-3 border border-[#49454f]"
        >
          <p class="text-xs font-bold text-[#d0bcff] uppercase">
            Bảng Tổng Kết
          </p>
          <div
            id="summary-list"
            class="grid grid-cols-2 sm:grid-cols-3 gap-3"
          ></div>
        </div>
        <div id="history-list" class="space-y-4"></div>
      </div>
    </div>

    <script>
      let players = JSON.parse(localStorage.getItem("players")) || [];
      let history = JSON.parse(localStorage.getItem("history")) || [];
      let gameNo =
        history.length > 0 ? history[history.length - 1].gameNo + 1 : 1;

      function render() {
        const list = document.getElementById("player-list");
        const liveCaiSticky = document.getElementById("cai-live-sticky");
        const liveCaiDiffText = document.getElementById("live-cai-diff");
        const totalBetText = document.getElementById("total-bet-live");
        const caiNameText = document.getElementById("cai-name-text");

        list.innerHTML = "";
        let caiDiff = 0;
        let totalBet = 0;
        let caiObj = players.find((p) => p.isCai);

        players.forEach((p) => {
          if (!p.isCai) {
            const betAmount = (parseInt(p.currentBet) || 0) * (p.mul || 1);
            totalBet += betAmount;
            if (p.status === "lose") caiDiff += betAmount;
            else if (p.status === "win") caiDiff -= betAmount;
          }
        });

        if (caiObj) {
          liveCaiSticky.classList.remove("hidden");
          caiNameText.innerText = caiObj.name;
          totalBetText.innerText = totalBet.toLocaleString() + "đ";
          liveCaiDiffText.innerText =
            (caiDiff >= 0 ? "+" : "") + caiDiff.toLocaleString() + "đ";
          liveCaiDiffText.className = `text-base font-black ${caiDiff >= 0 ? "text-green-400" : "text-red-400"}`;
        } else {
          liveCaiSticky.classList.add("hidden");
        }

        // Sắp xếp đưa Chủ Sòng lên đầu danh sách trước khi vẽ
        const sortedPlayers = [...players].sort((a, b) =>
          b.isCai === a.isCai ? 0 : b.isCai ? 1 : -1,
        );

        sortedPlayers.forEach((p) => {
          // Tìm index gốc của player trong mảng players để các hàm update chạy đúng
          const originalIndex = players.indexOf(p);

          if (!p.status) p.status = "lose";
          if (!p.mul) p.mul = 1;
          const cardHtml = `
            <div class="m3-card p-4 ${p.isCai ? "is-cai-active" : ""}">
              <div class="flex justify-between items-center mb-3">
                <div>
                  <h3 class="font-bold text-base truncate w-48 uppercase tracking-wide">${p.name}</h3>
                </div>
                <div class="flex items-center gap-3">
                   <button onclick="setAsCai(${originalIndex})" class="px-3 py-1.5 rounded-lg bg-[#381e72] text-[10px] font-bold uppercase ${p.isCai ? "hidden" : ""}">Làm cái</button>
                   <button onclick="removePlayer(${originalIndex})" class="text-gray-500 hover:text-red-400 text-2xl leading-none px-2">&times;</button>
                </div>
              </div>
              ${
                p.isCai
                  ? `
                <button onclick="cancelCai(${originalIndex})" class="w-full bg-[#4a4458] py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest border border-white/10">Thôi làm cái</button>
              `
                  : `
                <div class="flex items-center gap-3">
                  <div class="flex-[1.8] flex items-center bg-[#1c1b1f] rounded-lg px-3 py-2 border border-gray-700">
                    <span class="text-[9px] text-gray-400 font-bold mr-2">CƯỢC</span>
                    <input type="number" value="${p.currentBet}" onchange="updateBet(${originalIndex}, this.value)" class="bg-transparent font-bold text-[#d0bcff] text-sm w-full text-right outline-none">
                  </div>
                  <div class="flex-1 flex gap-1.5">
                     ${[1, 2, 3].map((m) => `<button onclick="updateMul(${originalIndex}, ${m})" class="flex-1 py-2 rounded-md text-[10px] font-bold ${p.mul === m ? "bg-[#d0bcff] text-black" : "bg-[#49454f]"}">x${m}</button>`).join("")}
                  </div>
                </div>
                <div class="flex gap-2 mt-3">
                  <button onclick="updateStatus(${originalIndex}, 'win')" class="status-btn ${p.status === "win" ? "status-win" : "status-draw"} uppercase">THẮNG</button>
                  <button onclick="updateStatus(${originalIndex}, 'draw')" class="status-btn ${p.status === "draw" ? "bg-white text-black" : ""} uppercase">HÒA</button>
                  <button onclick="updateStatus(${originalIndex}, 'lose')" class="status-btn ${p.status === "lose" ? "status-lose" : "status-draw"} uppercase">THUA</button>
                </div>
              `
              }
            </div>
          `;
          list.innerHTML += cardHtml;
        });
        document.getElementById("current-game-no").innerText = gameNo;
        saveData();
      }

      function addPlayer() {
        const input = document.getElementById("new-player-name");
        if (!input.value.trim()) return;
        players.push({
          name: input.value.trim(),
          balance: 0,
          currentBet: 5000,
          isCai: false,
          status: "lose",
          mul: 1,
        });
        input.value = "";
        render();
      }
      function removePlayer(index) {
        if (confirm("Xóa người chơi này?")) {
          players.splice(index, 1);
          render();
        }
      }
      function resetAll() {
        if (confirm("Reset toàn bộ lịch sử và số dư về 0?")) {
          history = [];
          gameNo = 1;

          players.forEach((p) => {
            p.balance = 0;
            p.status = "lose";
            p.mul = 1;
          });

          saveData();

          render();

          const container = document.getElementById("history-list");
          const summaryList = document.getElementById("summary-list");

          if (container)
            container.innerHTML =
              '<div class="text-center py-10 text-gray-500 italic text-sm">Chưa có lịch sử ván đấu.</div>';
          if (summaryList) summaryList.innerHTML = "";

          renderHistory();

          alert("Đã xóa sạch dữ liệu!");
        }
      }
      function setAsCai(index) {
        players.forEach((p) => {
          p.isCai = false;
          p.status = "lose";
          p.mul = 1;
        });
        players[index].isCai = true;
        players[index].currentBet = 0;
        render();
      }
      function cancelCai(index) {
        players[index].isCai = false;
        render();
      }
      function updateBet(index, val) {
        players[index].currentBet = parseInt(val) || 0;
        render();
      }
      function updateStatus(index, status) {
        players[index].status = status;
        render();
      }
      function updateMul(index, m) {
        players[index].mul = m;
        render();
      }

      function applyQuickBet() {
        const val =
          parseInt(document.getElementById("quick-bet-value").value) || 0;
        players.forEach((p) => {
          if (!p.isCai) p.currentBet = val;
        });
        render();
      }

      function finishGame() {
        const caiIndex = players.findIndex((p) => p.isCai);
        if (caiIndex === -1) return alert("Vui lòng chọn người làm CHỦ SÒNG!");
        let missingBetPlayers = players.filter(
          (p) => !p.isCai && (!p.currentBet || p.currentBet <= 0),
        );
        if (missingBetPlayers.length > 0) {
          let names = missingBetPlayers.map((p) => p.name).join(", ");
          return alert(
            `LỖI: Người chơi (${names}) chưa đặt cược hoặc mức cược không hợp lệ!`,
          );
        }

        let caiDiff = 0;
        players.forEach((p) => {
          if (!p.isCai) {
            const betAmount = (parseInt(p.currentBet) || 0) * (p.mul || 1);
            if (p.status === "lose") caiDiff += betAmount;
            else if (p.status === "win") caiDiff -= betAmount;
          }
        });
        if (
          !confirm(
            `Kết thúc ván? CHỦ SÒNG: ${caiDiff >= 0 ? "+" : ""}${caiDiff.toLocaleString()}đ`,
          )
        )
          return;

        let logDetails = [];
        players.forEach((p) => {
          if (p.isCai) return;
          const finalBet = (parseInt(p.currentBet) || 0) * (p.mul || 1);
          let change =
            p.status === "win" ? finalBet : p.status === "lose" ? -finalBet : 0;
          p.balance += change;
          logDetails.push({
            name: p.name,
            change: change,
            isCai: false,
            mul: p.mul,
          });
        });
        players[caiIndex].balance += caiDiff;
        logDetails.splice(caiIndex, 0, {
          name: players[caiIndex].name,
          change: caiDiff,
          isCai: true,
        });

        history.push({
          gameNo: gameNo,
          totalPool: caiDiff,
          details: logDetails,
          timestamp: new Date().toLocaleTimeString("vi-VN", {
            hour: "2-digit",
            minute: "2-digit",
          }),
        });
        players.forEach((p) => {
          p.status = "lose";
          p.mul = 1;
        });
        gameNo++;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function saveData() {
        localStorage.setItem("players", JSON.stringify(players));
        localStorage.setItem("history", JSON.stringify(history));
      }
      function switchTab(tab) {
        const isHome = tab === "home";
        document.getElementById("tab-home").classList.toggle("active", isHome);
        document
          .getElementById("tab-history")
          .classList.toggle("active", !isHome);
        document.getElementById("footer-action").style.display = isHome
          ? "block"
          : "none";
        document.getElementById("btn-home").className = isHome
          ? "flex-1 py-2 rounded-full text-sm font-semibold m3-btn-primary shadow-md"
          : "flex-1 py-2 rounded-full text-sm font-semibold text-[#cac4d0]";
        document.getElementById("btn-history").className = !isHome
          ? "flex-1 py-2 rounded-full text-sm font-semibold m3-btn-primary shadow-md"
          : "flex-1 py-2 rounded-full text-sm font-semibold text-[#cac4d0]";
        if (!isHome) renderHistory();
      }

      function renderHistory() {
        const container = document.getElementById("history-list");
        const summaryList = document.getElementById("summary-list");
        if (history.length === 0) {
          container.innerHTML =
            '<div class="text-center py-10 text-gray-500 italic text-sm">Chưa có lịch sử ván đấu.</div>';
          return;
        }

        let totalEarnings = {};
        history.forEach((h) =>
          h.details.forEach((d) => {
            totalEarnings[d.name] = (totalEarnings[d.name] || 0) + d.change;
          }),
        );
        summaryList.innerHTML = Object.entries(totalEarnings)
          .sort((a, b) => b[1] - a[1])
          .map(
            ([name, total]) => `
            <div class="summary-chip text-center"><p class="text-[10px] text-gray-400 truncate uppercase">${name}</p><p class="text-xs font-bold ${total >= 0 ? "text-green-400" : "text-red-400"}">${total.toLocaleString()}</p></div>
        `,
          )
          .join("");

        container.innerHTML = history
          .slice()
          .reverse()
          .map(
            (h) => `
          <div class="m3-card p-4 border-l-4 ${h.totalPool >= 0 ? "border-green-500" : "border-red-500"}">
            <div class="flex justify-between text-xs mb-3 border-b border-gray-700 pb-2"><span class="font-bold">Ván ${h.gameNo}</span><span class="text-gray-400">${h.timestamp}</span></div>
            <div class="space-y-1">${h.details.map((d) => `<div class="flex justify-between text-xs"><span>${d.name} ${d.isCai ? "(C)" : ""}</span><span class="${d.change > 0 ? "text-green-400" : d.change < 0 ? "text-red-400" : "text-gray-400"}">${d.change.toLocaleString()}</span></div>`).join("")}</div>
          </div>
        `,
          )
          .join("");
      }

      render();
    </script>
  </body>
</html>
